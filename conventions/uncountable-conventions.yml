filtering:
  mechanism: server-side listing configuration
  detail: >-
    Uncountable's distinctive convention: callers do not query entities directly. An
    administrator defines a Listing Configuration in the UI — base dataset, columns,
    filters — and the API call references it by `configReference`. Per-request filtering is
    limited to the `attributes` object supplying values for attribute-based filters the
    configuration already declares. The consequence for an integrator is that the query
    shape is governed in the product, not in the client.
