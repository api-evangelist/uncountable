reversibility:
  status: undocumented
  grade: null
  write_surface: true
  write_surface_evidence: >-
    The authorization server declares an EXTERNAL_API_WRITE scope and the /mcp WWW-Authenticate
    challenge requires it, so a write surface demonstrably exists.
  reversal_operations: []
  windows: []
  note: >-
    This is not `na`. Uncountable's platform plainly supports writes — an EXTERNAL_API_WRITE
    scope is declared by the live authorization server, the MCP server requests it, and the
    knowledgebase documents entity creation and recipe editing through Bodie AI tools. But the
    only publicly documented External API operation is a read (external_list_entities), and the
    write operations, together with any cancel/undo/restore path and any window in which one
    works, are documented only behind the application sign-in at https://app.uncountable.com/docs.
    No reversal operation and no window are stated on any public page, so none is recorded here.
    Inventing a window would be the one error in this pipeline that could cost a user real data:
    an agent told it can restore a deleted entity within 30 days, when no such guarantee is
    published, would act on a promise nobody made. The honest reading for an integrator is that
    reversibility must be established from the gated reference or from Uncountable directly
    before any agent is given write scope.
