- aid: uncountable:uncountable-mcp
  name: Uncountable MCP Server
  description: Uncountable ships a first-party hosted Model Context Protocol server at the /mcp path of
    each customer environment (https://app.uncountable.com/mcp for the US deployment, https://appeu.uncountable.com/mcp
    for the EU deployment). It is a remote MCP endpoint — no local install — protected by OAuth 2.0 with
    the EXTERNAL_API_READ and EXTERNAL_API_WRITE scopes, and documented for Claude.ai, ChatGPT and Microsoft
    Copilot Studio. Access through the server is limited to what the authenticating user can already see
    in that schema.
  humanURL: https://www.support.uncountable.com/knowledge-base/uncountable-mcp-setup-guide/
  baseURL: https://app.uncountable.com/mcp
  tags:
  - MCP
  - Agents
