apis:
- aid: uncountable:uncountable-external-api
  name: Uncountable External API
  description: The Uncountable External API is the authenticated REST surface of the Uncountable R&D platform.
    Its documented entry point is the list_entities endpoint, which returns rows from a Listing Configuration
    defined in the Uncountable UI rather than querying entities directly. It is protected by OAuth 2.0
    (authorization code with PKCE) using the EXTERNAL_API_READ and EXTERNAL_API_WRITE scopes, or by basic
    authentication for legacy use, and enforces the same role-based permissions as the web application.
    Full endpoint and parameter reference is published behind the application sign-in at /docs.
  humanURL: https://app.uncountable.com/docs
  baseURL: https://app.uncountable.com/api/external
  tags:
  - R&D Data
  - Laboratory Informatics
  - Listing Configuration
