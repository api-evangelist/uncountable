  - name: Finding and Reading Files
    purpose: discovers, reads, summarizes and compares files
  - name: Suggest Formulations Workflow
    purpose: generates optimized recipe suggestions via design of experiments
  - name: Background Research
    purpose: mines documents and experiments for formulation starting points
  - name: Suggest Graphs Workflow
    purpose: produces three to five chart suggestions for Explore Data
  - name: Upsert Entities Guide
    purpose: domain knowledge for creating and updating entity configurations
  - name: Label Editing
    purpose: guidelines for editing label templates and specs
  - name: DOE Constraints
    purpose: finds and edits constraints in design-of-experiments contexts
  - name: Creating Recipes
    purpose: creates recipes via helpbot tools from scratch
  - name: Creating Entities
    purpose: creates entities through helpbot tools
authored:
  note: >-
    One packaged skill is authored here, and only one, because Uncountable publishes exactly one
    External API operation. Skills for the write surface are deliberately not written: the
    operations exist (an EXTERNAL_API_WRITE scope is declared by the live authorization server)
    but their names, parameters and reversal semantics are behind the application sign-in, and a
    skill grounded in guessed operation names would teach an agent to call an API that may not
    exist in that shape.
  skills:
