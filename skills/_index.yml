note: >-
  Uncountable publishes its own agent-skill system. "Bodie" is the platform's AI assistant, and
  a Skill is a saved instruction or workflow — Markdown content plus a name, a lowercase-hyphen
  reference, a description that acts as the invocation trigger, and a "Loaded by Default"
  toggle — that Bodie loads and follows. The shape is closely analogous to a packaged Agent
  Skill: prose operating instructions that steer an assistant's use of underlying tools, rather
  than a direct tool binding.
  IMPORTANT SCOPE NOTE: these skills run INSIDE the Uncountable platform against Bodie's
  internal tools (the plotting skill, for example, instructs Bodie to call `create_plot` and
  `edit_explore_viz`). They are not distributed as files, are not fetchable, and are not
  invocable through the External API or the MCP server. The thirteen below are the worked
  examples Uncountable names in its public documentation; their Markdown bodies are not
  published, so only names and stated purposes are recorded — nothing has been reconstructed.
provider_published:
  system: Bodie AI Skills
  distributed_as: in-platform records, not files
  invocation: named directly in a prompt, or auto-loaded when marked "Loaded by Default"
  management_path: Bodie side panel -> ... -> Skills
  authoring_fields:
  - name
  - reference
  - description
  - content
  - loaded_by_default
  skill_count: 13
  skills:
  - name: Writing and Evaluating Value Spec
    purpose: drafts and troubleshoots value specs with evaluation context
  - name: Editing Recipes
    purpose: edits existing recipes via tools covering inputs, steps and workflow steps
  - name: Plotting Workflow
    purpose: creates and edits plots and visualizations in Explore Data
    named_tools:
    - create_plot
