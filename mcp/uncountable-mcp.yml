name: Uncountable MCP Server
status: live
vendor: Uncountable
official: true
description: A first-party, hosted Model Context Protocol server exposed at the /mcp path of every Uncountable
  environment. It is a remote endpoint an MCP client POSTs to directly — there is no npx/pip package and
  no local process. Access is OAuth 2.0 protected and scoped to what the authenticating user can already
  see in that schema, so the server inherits the platform's role-based access control rather than widening
  it.
