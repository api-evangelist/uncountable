tools:
  status: gated
  count: null
  note: tools/list requires a bearer token; the anonymous probe returns 401 with an invalid_token challenge.
    Uncountable does not publish the tool list on any public page, so no tool names or inputSchemas are
    recorded here. Recovering them requires authenticated introspection against a customer schema. The
    MCP setup guide's only worked example is the prompt "Fetch me some projects using the Uncountable
    MCP", which implies read tools over platform entities but names no tool.
