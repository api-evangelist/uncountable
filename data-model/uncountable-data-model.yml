note: >-
  There is no public OpenAPI for Uncountable, so this is not a schema-derived entity graph. It is
  the entity vocabulary the platform documents to its own users, read off the importer articles
  (one importer per entity type) and the platform-structure articles. Field-level schemas, id
  formats and id prefixes are NOT published and are therefore absent here rather than guessed.
  The relationships recorded are only those stated in the article titles and bodies — for
  example "Importing Outputs with Condition Parameters on Lots" states that outputs carry
  condition parameters on lots. Anything a reader might reasonably expect (a Recipe belongs to a
  Project, say) but that no article states, is left out.
  This is useful chiefly as an integration vocabulary: it tells you which `entityType` values the
  External API's list_entities call is likely to accept, since the API is entity-typed.
